<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary-color: #1b4d3e;
            --secondary-color: #f4f6f5;
            --accent-color: #e67e22;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        header p {
            margin: 5px 0 0;
            font-size: 0.95rem;
            opacity: 0.9;
        }
        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex: 1;
            box-sizing: border-box;
        }
        .story-counter {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .story-title {
            font-size: 1.4rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
        }
        .story-content {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 25px;
            white-space: pre-line;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid var(--accent-color);
        }
        .buttons-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-next {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-next:hover {
            background-color: #14382d;
        }
        .btn-whatsapp-share {
            background-color: #25d366;
            color: white;
        }
        .btn-whatsapp-share:hover {
            background-color: #1ebe5d;
        }
        
        .social-links {
            border-top: 2px dashed #e2e8f0;
            padding-top: 15px;
            text-align: center;
        }
        .social-links h3 {
            font-size: 1rem;
            color: #555;
            margin-bottom: 10px;
        }
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .social-btn {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .tg-btn { background-color: #0088cc; }
        .wa-btn { background-color: #25d366; }
        .tt-btn { background-color: #010101; }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #e2e8f0;
            font-size: 0.85rem;
            color: #555;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>

        <p>رفقات... ولو واحد ذيب والتاني خروف!</p>
    </header>

    <div class="container">

        <div class="buttons-group">

            <div class="social-buttons">

                <a href="https://wa.me/96399250470" target="_blank" class="social-btn wa-btn">راسلني واتساب 💬</a>

                <a href="https://www.tiktok.com/@abod5_11" target="_blank" class="social-btn tt-btn">تيك توك 🎬</a>

        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة - عالم الذيب والخروف &copy; 2026
    </footer>

    <script>

            { title: "الذيب ع طاولة البوكر", text: "🐺 الذيب: مرة رح أربح كل المصاري!\n🐑 الخروف: بس لا تبكي لما تخسر...\n🐺 الذيب: أنا ما بخسر أبداً!" },
            { title: "الصورة التذكارية", text: "🐺 الذيب: وقف بدي آخد معك سيلفي. اسحب وجهك لورا شوي!\n🐑 الخروف: ليش لوراء؟ ما شاء الله الخشوم واضحة بالصورة اتنيناتها!" },
            { title: "الرجيم القاسي", text: "🐑 الخروف: مقرر أعمل رجيم قاسي وأخسر وزن.\n🐺 الذيب بابتسامة خبيثة: فكرة ممتازة! كل ما ضعفت، كل ما كنت أسهل... قصدي أسرع بالحركة!" },
            { title: "منزل الأحلام", text: "🐺 الذيب: عم فكر ابني بيت جديد، شو رأيك بالديكورات الحديثة؟\n🐑 الخروف: أهم شي يكون باب البيت من برة عريض، لانو اذا هجمت عليك شي مرة أعرف هرب بسرعة!" },
            { title: "فحص العقل", text: "🐑 الخروف: رحت عند حكيم العيون وقلي نظرك ضعيف.\n🐺 الذيب: عادي، مو غريب عليك... طول عمرك ماشي ورا القطيع بدون ما تشوف وين رايح!" },
            { title: "مسابقة الأكل", text: "🐺 الذيب: شرايك ندخل مسابقة أكل ونقسم الجائزة بالنص؟\n🐑 الخروف: خايف آكل كتير وتخلص الجائزة وتعتبرني أنا الوجبة الرئيسية!" },
            { title: "تأمين السيارات", text: "🐑 الخروف: سجلت سيارتي بتأمين شامل ضد الحوادث.\n🐺 الذيب: خطوة موفقة، بس نسيت تضمن حالك من غدر الذيب بالطريق السريع!" },
            { title: "ساعة الصباح", text: "🐺 الذيب: ليش دايماً بتفيق بكير وبتعمل رياضة الصبح؟\n🐑 الخروف: عشان أكون بنشاطي ولياقتي لما أحتاج أركض منك!" },
            { title: "رحلة الصيد", text: "🐑 الخروف: شرايك نطلع نطلع رحلة صيد بالغابة؟\n🐺 الذيب: بلا ما نروح صيد... خلص، اعتبر حالك صتني وأنا صتك وخلصنا!" },
            { title: "الحظ السيء", text: "🐺 الذيب: يا زلمة حظي نحس، كل ما خطط لشغلة بتخرب!\n🐑 الخروف: اتذكر دائماً أنك ذيب، يعني النحس حرام بحقك، اترك النحس لأمثالي!" },
            { title: "موقع العمل", text: "🐑 الخروف: عم افتش على شغلة جديدة بمجال الإدارة.\n🐺 الذيب: في شواغر عندي، بس الدوام بيكون بطوننا... قصدي بكتيبة الحراسة!" },
            { title: "كورس اللغات", text: "🐺 الذيب: عم اتعلم لغة جديدة لأحكي مع كل حيوانات الغابة.\n🐑 الخروف: علمنا لغة الخرفان، مشان نفهم شو عم تحكي علينا من وراء ظهرنا!" },

            { title: "شارب الذيب", text: "🐑 الخروف: ليش شاربك دايماً مجدول وطويل؟\n🐺 الذيب: هيبة يا صاحبي، هيبة! مو مثلك شاربك دوبو طالع." },
            { title: "اختبار الذكاء", text: "🐺 الذيب: عملت اختبار ذكاء وطلعت عبقري.\n🐑 الخروف: الأختبار كان اختياري ولا صح وغلط؟ لأنك لوحدك باللجنة أكيد رح تنجح!" },
            { title: "السرعة القصوى", text: "🐑 الخروف: قدرت أركض مسافة كيلومتر بدقيقة واحدة!\n🐺 الذيب: عظيم! بس لما أركض وراك رح تقطع نفس المسافة بثانية وحدة." },

            { title: "لعبة الشطرنج", text: "🐑 الخروف: العب معي شطرنج لنشوف مين أذكى.\n🐺 الذيب: لا تحرج حالك، أنت من أول نقلة بتضحي بحالك." },

            { title: "فقدان الذاكرة", text: "🐑 الخروف: تصدق نسيت وين حطيت أكلي اليوم؟\n🐺 الذيب: مو غريب عليك، طول عمرك ماشي بالدنيا غايب عن القضايا." },
            { title: "مشاكل النت", text: "🐺 الذيب: شبكة الإنترنت عندك بطيئة كتير.\n🐑 الخروف: لأن الراوتر بعيد، مو مثلك شبكتك قوية لأنك بتلقط أي شي عالتطير!" },

            { title: "شراء سيارة", text: "🐺 الذيب: ناوي أشتري سيارة دفع رباعي جبّار.\n🐑 الخروف: اشتري اللي بدك ياها، بس لا تركض فيا جنبي لانو فراملي ضعيفة." },
            { title: "حلم الليل", text: "🐑 الخروف: حلمت البارحة أني صرت ذيب وقوي.\n🐺 الذيب: أحلام اليقظة حلوة، بس اصحى على ريحة الواقع عاد!" },
            { title: "صوت العاصفة", text: "🐺 الذيب: عواء الذئب بالليل بيبعث الرعب بالقلوب.\n🐑 الخروف: وصوت صياحك لما تنقرص بيبعث الضحكة بالقلوب!" },
            { title: "نصيحة مالية", text: "🐑 الخروف: كيف أجمع ثروة وأصير غني؟\n🐺 الذيب: اترك المصاري عندي وأنا بحفظلك ياها لآخر العمر!" },
            { title: "رحلة البحر", text: "🐺 الذيب: شرايك ننزل نسبح بالبحر؟\n🐑 الخروف: بتعرف إني ما بعوم، وبعدين البحر مليان أسماك وأنت مليان طماعي!" },

            { title: "مسابقة الجري", text: "🐺 الذيب: شرايك نتسابق لنشوف مين الأسرع؟\n🐑 الخروف: إما أني بربح وبأخد الجائزة، أو أنك بتربح وبتاخدني أنا.. بلاها أحسن!" },
            { title: "بناء المستقبل", text: "🐑 الخروف: لازم نفكر بمستقبلنا ونخطط لقدام.\n🐺 الذيب: مستقبلنا مرتبط ببعض.. أنت الخطط وأنا التنفيذ!" },
            { title: "زيارة الطبيب", text: "🐺 الذيب: عندي ألم خفيف بأنيابي من كثر ما قرمشت جوز.\n🐑 الخروف: أنا عندي ألم بقلبي من كثر ما بتخوفني كل ما شفتك!" },

            { title: "موقف ضايع", text: "🐑 الخروف: ضاع طريقي وما عم أعرف ارجع عالحظيرة.\n🐺 الذيب: لا تخاف، أنا بَدليك الطريق.. تعقّل وامشي قدامي بس!" },
            { title: "موسم الصوف", text: "🐺 الذيب: شو رح تعمل بموسم قص الصوف؟\n🐑 الخروف: رح أبكي، لانو رح أبين عريان قدام الكل.\n🐺 الذيب: ولا تقلق، أنا بغطيك.. بجلدي! (قصدي بصداقتي)." },

            { title: "الأصحاب الوفيين", text: "🐺 الذيب: ما في أوفى مني كصديق بيحميك من الغربان.\n🐑 الخروف: صحيح، بتحميني من الغربان لتاكلني أنت برواق!" },
            { title: "نهاية المطاف", text: "🐑 الخروف: يا ذيب، معقول نبقى أصحاب للأبد هيك؟\n🐺 الذيب يضحك: للأبد يا صاحبي.. للأبد!" }
        ];

        let currentIndex = 0;

        function updateStory() {
            const current = stories[currentIndex];
            document.getElementById("storyCounter").innerText = `القصة رقم ${currentIndex + 1} من ${stories.length}`;
            document.getElementById("storyTitle").innerText = current.title;
            document.getElementById("storyContent").innerText = current.text;
        }

        function nextStory() {
            currentIndex = (currentIndex + 1) % stories.length;
            updateStory();
        }

        function shareOnWhatsApp() {
            const current = stories[currentIndex];
            const textToShare = `😂 *عالم الذيب والخروف* 🐺🐑\n\n*${current.title}*\n${current.text}\n\n📲 اقرأ المزيد من القصص الشامية المضحكة!`;
            const encodedText = encodeURIComponent(textToShare);
            window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
        }

        updateStory();
    </script>
</body>
</html>
